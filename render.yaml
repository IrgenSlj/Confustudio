# Render.com deployment (one-click via "New + → Blueprint" pointed at this repo).
# Fly.io is the primary target (see fly.toml); this is a portable alternative.
services:
  - type: web
    name: confustudio
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Public assistant deployment is blocked until the authenticated API phase.
      # Do not add provider keys or CONFUSTUDIO_ENABLE_ASSISTANT_PROXY here.
